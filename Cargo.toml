[workspace]
resolver = "2"
members = [
    "crates/harness-protocol",
    "crates/harness-events",
    "crates/harness-core",
    "crates/harness-policy",
    "crates/harness-logging",
    "crates/harness-state",
    "crates/harness-perception",
    "crates/harness-target-resolver",
    "crates/harness-verifier",
    "crates/harness-recovery",
    "crates/harness-replay",
    "crates/harness-capture",
    "crates/harness-input",
    "crates/harness-windows-uia",
    "crates/harness-browser",
    "crates/harness-gateway",
    "crates/harness-mcp",
    "crates/harness-adb",
    "crates/harness-plugins",
    "crates/harness-hud",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Harness Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/harness-dev/harness"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tokio-tungstenite = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1